name: modern_locate
description: "A modern ride hailing location package"
version: 0.0.1
homepage:

environment:
  sdk: ^3.13.4
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.kawsar.modern_locate
        pluginClass: ModernLocatePlugin
      ios:
        pluginClass: ModernLocatePlugin