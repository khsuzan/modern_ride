name: modern_ride
description: "A modern ride hailing app"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  modern_locate:
    path: ./packages/modern_locate
  equatable: ^3.0.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  dio: ^5.11.1
  bloc_concurrency: ^0.3.0
  stream_transform: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
