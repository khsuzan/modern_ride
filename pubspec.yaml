name: modern_ride
description: "A modern ride hailing app"
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.13.4


dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  modern_locate:
    path: ./packages/modern_locate
  equatable: ^3.0.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
